<!DOCTYPE html>
<html lang="sd" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14382b">
<title>مشڪ محبوب محل</title>
<style>
body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#14382b;color:#fff;font-family:Tahoma,sans-serif;text-align:center}
button{font:inherit;font-size:18px;padding:10px 24px;border:0;border-radius:10px;background:#b8893b;color:#fff;margin-top:16px}
#m{font-size:20px;padding:0 20px}
</style></head><body>
<div id="m">لوڊ ٿي رهيو آهي...</div>
<button id="b" style="display:none" onclick="go()">ٻيهر ڪوشش ڪريو</button>
<script>
var URL_='https://khanp4815-rgb.github.io/perfume-/';
function go(){
  document.getElementById('b').style.display='none';
  document.getElementById('m').textContent='لوڊ ٿي رهيو آهي...';
  if(navigator.onLine===false){fail();return}
  location.replace(URL_+'?r='+Date.now());
  setTimeout(fail,15000);
}
function fail(){
  document.getElementById('m').textContent='انٽرنيٽ ناهي يا لنڪ نه کلي. انٽرنيٽ آن ڪري ٻيهر ڪوشش ڪريو.';
  document.getElementById('b').style.display='';
}
go();
</script></body></html>
